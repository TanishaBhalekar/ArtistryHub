{% extends "base.html" %}

{% block title %}500 Server Error - ArtistryHub{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="frosted-glass p-5 max-w-md mx-auto my-5">
        <i class="bi bi-shield-x display-1 text-danger mb-3"></i>
        <h2 class="fw-bold mb-2">Unexpected Server Error</h2>
        <p class="text-secondary small mb-4">An internal error occurred. Don't worry, your portfolio assets and data remain secure.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-gradient px-4">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
